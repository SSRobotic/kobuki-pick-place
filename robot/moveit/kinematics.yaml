# KDL solver for the RViz drag handle and pose goals. The SO-100 has only 5 arm joints, so a full 6-D pose
# is usually unreachable: position_only_ik lets KDL solve for where the jaw centre is, not which way it points.
# arm_control.py does not need this: it solves its own IK and gives MoveIt joint goals.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
